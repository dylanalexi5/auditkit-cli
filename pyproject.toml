[project]
name = "auditkit-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.0",
    "groq>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
