[project]
name = "auditkit-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.0",
    "groq>=1.0",
    # Solo pinta: el reporte se sigue armando a mano en report.py y en modo no
    # interactivo sale identico al de siempre (ADR 0006). Va como dependencia
    # principal y no como extra —a diferencia de sentence-transformers, que
    # arrastra torch— porque es Python puro y la interfaz es la experiencia por
    # defecto: un extra que hay que instalar para que el comando se vea bien es
    # un extra que nadie instala.
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # numpy va acá y no solo en `rag` porque `tests/test_embedding_index.py` y
    # `tests/test_ask.py` lo importan a nivel de módulo: sin él, `pytest` ni
    # siquiera llega a coleccionar. `sentence-transformers` no hace falta —
    # esos tests inyectan el encoder— y por eso se queda en `rag`, con torch
    # y sus 2 GB adentro.
    "numpy>=1.24",
]
# `--ask` es opt-in y sentence-transformers arrastra torch (~2GB), asi que va
# como extra y no como dependencia principal. El manejo de
# ModeloNoDisponibleError ya existe y es el complemento correcto de un extra.
#
# Estaban importadas sin declarar, que es exactamente el bug que este proyecto
# existe para encontrar: deps_check marcaba NO_SOSTENIBLE contra este repo -- el
# auditor fallaba su propia auditoria. faiss-cpu NO se declara porque no se
# importa en ningun archivo (ADR 0003 lo midio: 2ms de construccion contra un
# matmul de numpy que a esta escala es sub-milisegundo).
rag = [
    "sentence-transformers>=3.0",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: carga el modelo de embeddings real (~7.6s la primera vez del proceso)",
]

[tool.ruff]
line-length = 100
